# Based on the original project's Ultralytics packaging metadata.
[build-system]
requires = ["setuptools>=70.0.0,<=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Keep the original distribution name for Ultralytics runtime metadata checks.
name = "ultralytics"
dynamic = ["version"]
description = "BSQ-YOLO: progressive semantic feedback for water-surface floating-litter detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
dependencies = [
    "numpy>=1.23.0",
    "matplotlib>=3.3.0",
    "opencv-python>=4.6.0",
    "pillow>=7.1.2",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "torch>=2.0.0,!=2.4.0",
    "torchvision>=0.15.0",
    "psutil>=5.8.0",
    "polars>=0.20.0",
    "ultralytics-thop>=2.0.18",
    # Imported by the project's shared neural-network modules.
    "PyWavelets>=1.4.1",
    "einops>=0.6.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.12.0", "onnxslim>=0.1.82"]

[project.scripts]
yolo = "ultralytics.cfg:entrypoint"
ultralytics = "ultralytics.cfg:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultralytics", "ultralytics.*"]
namespaces = true

[tool.setuptools.package-data]
ultralytics = ["**/*.yaml", "**/*.txt", "py.typed", "solutions/templates/*.html"]

[tool.setuptools.dynamic]
version = {attr = "ultralytics.__version__"}
