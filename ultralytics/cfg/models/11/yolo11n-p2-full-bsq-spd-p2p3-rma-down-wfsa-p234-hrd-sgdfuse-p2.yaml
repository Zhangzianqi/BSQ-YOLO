# YOLO11n + Full P2-PAN + Shallow SPDConv + BSQ-FPN
# + RMADown + WFSA + SGDFuseP2 + Lightweight HRDP2Detect
#
# A6 + H:
#   A2: backbone layers 1 and 3 use SPDConv
#   B : BSQ semantic feedback at layers 11-13
#   R : backbone layers 5 and 7 use RMADown
#   W : WFSA is added after P2, P3, and P4 feature blocks
#   G : P2 Concat + C3k2 is replaced by SGDFuseP2
#   H : ordinary Detect is replaced by lightweight HRDP2Detect

nc: 6

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2, stem

  # Shallow SPDConv
  - [-1, 1, SPDConv, [128, 3]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2-B2/4

  - [-1, 1, SPDConv, [256, 3]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4-B3/8

  # RMADown
  - [-1, 1, RMADown, [512, 5, 0.5]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6-B4/16

  - [-1, 1, RMADown, [1024, 5, 0.5]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 8
  - [-1, 1, SPPF, [1024, 5]]                  # 9
  - [-1, 2, C2PSA, [1024]]                    # 10-B5/32

head:
  # BSQ semantic feedback: B4 + B5 -> S4
  - [[6, 10], 1, BSQGather, [4]]              # 11-S4/16

  # B3 + S4 -> B3'
  - [[4, 11], 1, BSQFeedback, [8, 1.0, true]] # 12-B3'/8

  # B2 + B3' -> B2'
  - [[2, 12], 1, BSQFeedback, [8, 1.0, true]] # 13-B2'/4

  # P5 -> P4
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 6], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [512, False]]                # 16-P4-TD/16

  # P4 -> P3, use B3'
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 12], 1, Concat, [1]]                 # 18
  - [-1, 2, C3k2, [256, False]]                # 19-P3-TD/8

  # P3 -> P2, SGDFuseP2 replaces Concat + C3k2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20
  - [[-1, 13], 1, SGDFuseP2, [256, 4, 2, 0.10]] # 21-P2 fusion

  # Preserve downstream layer indices
  - [-1, 1, nn.Identity, []]                   # 22-P2/4

  # P2 WFSA
  - [-1, 1, WFSA, []]                          # 23-P2 WFSA

  # P2 -> P3
  - [-1, 1, Conv, [256, 3, 2]]                 # 24
  - [[-1, 19], 1, Concat, [1]]                 # 25
  - [-1, 2, C3k2, [256, False]]                # 26-P3/8

  # P3 WFSA
  - [-1, 1, WFSA, []]                          # 27-P3 WFSA

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 28
  - [[-1, 16], 1, Concat, [1]]                 # 29
  - [-1, 2, C3k2, [512, False]]                # 30-P4/16

  # P4 WFSA
  - [-1, 1, WFSA, []]                          # 31-P4 WFSA

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 32
  - [[-1, 10], 1, Concat, [1]]                 # 33
  - [-1, 2, C3k2, [1024, True]]                # 34-P5/32

  # Lightweight HRDP2Detect
  # args: [nc, gate_reduction, use_semantic_gate, residual_scale, p2_reg_channels]
  - [[23, 27, 31, 34], 1, HRDP2Detect, [nc, 4, true, 0.10, 48]] # 35